---
- name: Ensure Kubernetes namespace exists
  command: kubectl create namespace stock-portfolio
  ignore_errors: yes

- name: Apply Vault configuration
  command: kubectl apply -f {{ playbook_dir }}/../k8s/vault-secret.yaml

- name: Delete existing builder job if exists to ensure clean run
  command: kubectl delete job docker-image-builder -n stock-portfolio
  ignore_errors: yes

- name: Apply K8s Builder Job
  command: kubectl apply -f {{ playbook_dir }}/../k8s/builder-job.yaml

- name: Wait for K8s Builder Job to complete
  command: >
    kubectl wait --for=condition=complete --timeout=3600s
    job/docker-image-builder -n stock-portfolio
