---
- name: Ensure Kubernetes namespace exists
  command: kubectl create namespace stock-portfolio
  ignore_errors: yes

- name: Apply Vault configuration
  command: kubectl apply -f {{ playbook_dir }}/../k8s/vault-secret.yaml

- name: Deploy Microservices
  command: kubectl apply -f {{ playbook_dir }}/../k8s/deployment.yaml

- name: Apply Horizontal Pod Autoscaler (HPA)
  command: kubectl apply -f {{ playbook_dir }}/../k8s/hpa.yaml
